schema_version: 1
product: PaperTrace — Evidence Review Workbench
status: proposed-awaiting-student-review
scope:
  workflow:
  - Import papers
  - AI retrieval of candidate evidence
  - Human acceptance/exclusion
  - Answer only from approved evidence
  - Traceability report export
  modules:
    A: library
    B: retrieval
    C: review
    D: answer
    E: reports
  platform: Python + original PaperQA2 + thin adapter + local Streamlit; single machine, single user, single writer
  not_in_scope:
  - Rewriting PaperQA2 independently
  - Large frontend/database server/cloud platform
  - Fetching papers from the whole web
  - Third-party prebuilt pickle indexes
  - Automatically declaring scientific facts correct
  - Physically reclaiming all upstream indexes during a run
priorities:
  Must:
  - Each of the five modules has business features/tests/a genuine OpenCode process
  - Immutable snapshots and the human-approved release boundary
  - D1-D9 and evidence for the six gates
  Should:
  - Better evidence comparison and report readability
  Could:
  - Convenience improvements for batch operations
  Wont:
  - Multi-user/cloud deployment/multimodal/autonomous Agent loops
tradeoffs:
- Cut convenience first, not the authorization boundary/full regression/honest disclosure
- Start single-machine single-writer; reopen an ADR if concurrent-write needs arise
- Initialization is not a student's formal OpenCode development contribution
registry: requirements.yaml
course_sources:
  project: CS5351-2026-2027-project.pdf:p3-10
  introduction: cs5351-2026-2027-introduction.pdf:p5,20-26
unresolved_student_decisions:
- The process-role arrangement for the role rotation described in the source text and for the one-time feature split
- The final wording for the five session transcripts versus the single D5 session / the from-scratch statement
- Instructor confirmation that extending PaperQA2 counts as a project of the same complexity
- The course-accepted boundary for this round's initialization not being OpenCode output
- The real deadline and the actual work investment
- Authorization for the real model provider/model/data/cost
