schema_version: 1
project: PaperTrace
baseline: c692d0dfeac4a0296599f7fe21a253a58b7ac12a
status: proposed-awaiting-student-review
requirements:
- id: FR-A-01
  type: functional
  owner: A
  statement: Import local PDF/TXT files, show the success, failure and cause for each file, and keep the logical literature ID separate from the content SHA256 version.
  fit_criterion:
    metric: import_case_pass_ratio
    operator: '>='
    threshold: 1.0
    verification: A positive/negative import tests; this round is contract tests only, the business logic is not developed
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: FR-A-02
  type: functional
  owner: A
  statement: Literature changes create a new immutable snapshot, and old snapshots and history records must not be overwritten.
  fit_criterion:
    metric: mutated_historical_snapshots
    operator: ==
    threshold: 0
    verification: Same path with changed content/deletion/duplicate literature/failed import cases
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: FR-B-01
  type: functional
  owner: B
  statement: Retrieve candidate evidence through the fixed PaperQA2 async interface, and output locatable source text, version and the team-derived identity; the summary and relevance score are advisory only.
  fit_criterion:
    metric: candidate_records_with_valid_source_ratio
    operator: ==
    threshold: 1.0
    verification: Synthetic Context adaptation and real-upstream offline integration tests
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - paperqa:src/paperqa/docs.py:156-169,492-500
  - paperqa:src/paperqa/types.py:238-316
  implementation_status: planned
- id: FR-B-02
  type: functional
  owner: B
  statement: Retrieval failures, timeouts, empty results and model parse errors show an explicit status; fabricating evidence or silently switching models is forbidden.
  fit_criterion:
    metric: unreported_retrieval_failures
    operator: ==
    threshold: 0
    verification: Exception injection and bounded-retry/no-network negative tests
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: FR-C-01
  type: functional
  owner: C
  statement: Only a genuine human action can accept/exclude/reset evidence; review decisions are appended and advance the review revision and digest.
  fit_criterion:
    metric: unauthorized_accepted_decisions
    operator: ==
    threshold: 0
    verification: Model suggestion grants no permission/forged actor/revert and reset tests
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: FR-C-02
  type: functional
  owner: C
  statement: When comparing at least two pieces of evidence, show the literature, version, source locator, summary and review rationale; similarity must not be automatically treated as the same evidence.
  fit_criterion:
    metric: required_comparison_fields_present_ratio
    operator: ==
    threshold: 1.0
    verification: Display of opposing claims from two sources and tests that the ledger is unchanged
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: FR-D-01
  type: functional
  owner: D
  statement: When there is no human-approved evidence, return the abstained status and enter no generation call.
  fit_criterion:
    metric: generation_attempts_with_empty_approved_set
    operator: ==
    threshold: 0
    verification: Model outbound spy assertions; the real business logic is not developed
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p3,5
  - audit:GAP-05
  implementation_status: planned
- id: FR-D-02
  type: functional
  owner: D
  statement: Answer citations must belong to evidence that was actually sent this round and is still validly approved; re-check the snapshot and the review revision/digest before release, and block on any change.
  fit_criterion:
    metric: unauthorized_or_stale_releases
    operator: ==
    threshold: 0
    verification: Negative tests for unsent/excluded/unknown citations and for corpus or review changes during generation
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: FR-D-03
  type: functional
  owner: D
  statement: Generate answers only through the controlled adapter path; automatic evidence addition by aquery, pre/post and autonomous Agent bypasses are forbidden; keep the raw citation mapping.
  fit_criterion:
    metric: uncontrolled_outbound_attempts
    operator: ==
    threshold: 0
    verification: Real adapter integration outbound spy and post-generation release gate tests
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - paperqa:src/paperqa/docs.py:588-721
  implementation_status: planned
- id: FR-E-01
  type: functional
  owner: E
  statement: Export the JSON and Markdown research report, containing the question, snapshot, approved and actually sent evidence, review decisions, answer, release result and source locators.
  fit_criterion:
    metric: export_roundtrip_required_fields_ratio
    operator: ==
    threshold: 1.0
    verification: Cross-session loading/export structure/version compatibility/source locator cases
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: FR-E-02
  type: functional
  owner: E
  statement: History reports are read-only; a new version marks the old snapshot as superseded, and the default export contains no credentials, local absolute paths or unauthorized full text of papers.
  fit_criterion:
    metric: sensitive_or_unlicensed_export_fields
    operator: ==
    threshold: 0
    verification: Hand-written redaction fixtures and history-unchanged hash tests
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: INV-01
  type: invariant
  owner: D
  statement: Zero approved evidence means zero generation calls; a model claiming to have evidence is not authorization.
  fit_criterion:
    metric: generation_attempts_with_empty_approved_set
    operator: ==
    threshold: 0
    verification: An invariant-breaking negative case must make the test fail; the concrete running tests are in the architecture trace matrix
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: INV-02
  type: invariant
  owner: A
  statement: Literature content versions, snapshots and evidence identities are immutable and their sources are locatable.
  fit_criterion:
    metric: identity_or_version_mismatches
    operator: ==
    threshold: 0
    verification: An invariant-breaking negative case must make the test fail; the concrete running tests are in the architecture trace matrix
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: INV-03
  type: invariant
  owner: C
  statement: Human review decisions are the only source of authorization; a model cannot fabricate or upgrade an accepted state.
  fit_criterion:
    metric: ai_granted_review_permissions
    operator: ==
    threshold: 0
    verification: An invariant-breaking negative case must make the test fail; the concrete running tests are in the architecture trace matrix
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: INV-04
  type: invariant
  owner: D
  statement: Cited set ⊆ this round's sent set ⊆ the current human accepted set; verify review and corpus freshness before release.
  fit_criterion:
    metric: invalid_released_citations
    operator: ==
    threshold: 0
    verification: An invariant-breaking negative case must make the test fail; the concrete running tests are in the architecture trace matrix
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: INV-05
  type: invariant
  owner: E
  statement: History research records are appended, never overwritten; old records keep the original text version and decisions.
  fit_criterion:
    metric: overwritten_history_records
    operator: ==
    threshold: 0
    verification: An invariant-breaking negative case must make the test fail; the concrete running tests are in the architecture trace matrix
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: INV-06
  type: invariant
  owner: governance
  statement: Coding agents have no read/write by default; access is an explicit per-role allow-list that protects credentials/frozen source/human rules and pushing.
  fit_criterion:
    metric: unauthorized_tool_effects
    operator: ==
    threshold: 0
    verification: An invariant-breaking negative case must make the test fail; the concrete running tests are in the architecture trace matrix
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: INV-07
  type: invariant
  owner: D
  statement: Each AI input is at most 12000 tokens, 9000 triggers compaction and output is at most 2000; after compaction the key constraints and the authorization identity are re-injected.
  fit_criterion:
    metric: context_budget_or_reinjection_violations
    operator: ==
    threshold: 0
    verification: An invariant-breaking negative case must make the test fail; the concrete running tests are in the architecture trace matrix
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: INV-08
  type: invariant
  owner: B
  statement: Do not import untrusted third-party pickle indexes, and do not equate a source paper's licence with the main project's code licence.
  fit_criterion:
    metric: untrusted_index_loads
    operator: ==
    threshold: 0
    verification: An invariant-breaking negative case must make the test fail; the concrete running tests are in the architecture trace matrix
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: QA-01
  type: quality
  owner: all
  statement: Shared contracts stay equal after canonical JSON serialization and re-parsing, and unknown fields and illegal states must be rejected.
  fit_criterion:
    metric: contract_roundtrip_and_negative_test_pass_ratio
    operator: ==
    threshold: 1.0
    verification: test/offline/test_contracts.py
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: PERF-01
  type: performance
  owner: all
  statement: In an offline environment with the hardware and versions recorded, 100 small contract JSON round-trips take at most 2 seconds in total; this does not imply any PaperQA performance improvement.
  fit_criterion:
    metric: contract_100_roundtrip_wall_seconds
    operator: <=
    threshold: 2.0
    verification: Independent timing benchmark, keeping the measured results; this round applies to small synthetic samples
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: COST-01
  type: cost
  owner: all
  statement: PaperTrace product initialization verification and the default offline tests make no product LLM calls; coding/review assistant inference is accounted separately in the AI-use log and no zero-quota claim is made; a real product evaluation must separately approve provider/model, data and cost/attempt caps.
  fit_criterion:
    metric: initialization_model_requests
    operator: ==
    threshold: 0
    verification: Network-disabled test; credential-free allow-listed environment before running; real evaluation authorization records
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: SEC-01
  type: security
  owner: all
  statement: The repository and deliverable packages must contain no real credentials or member personal information; team default tests use only hand-written synthetic data.
  fit_criterion:
    metric: detected_secrets_or_member_identity_fields
    operator: ==
    threshold: 0
    verification: Controlled path and content scan plus human review; user private directories are not scanned
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: GOV-01
  type: governance
  owner: all
  statement: Tests and the execution plan must be genuinely approved by a non-implementer before implementation starts; without that approval no formal business development/merge may proceed.
  fit_criterion:
    metric: unapproved_implementation_merges
    operator: ==
    threshold: 0
    verification: Trustworthy GitHub review/ordering evidence; this round awaits authorization and a self-written PR approved cannot prove itself
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p10:gate1
  - course-project:p7:D9
  implementation_status: planned
- id: GOV-02
  type: governance
  owner: all
  statement: Each round runs structural, full prior-regression and behavioural three-tier verification; prompt/model changes must pass a real fixed semantic evaluation before production.
  fit_criterion:
    metric: unverified_prompt_or_model_production_merges
    operator: ==
    threshold: 0
    verification: The six gates; without a real evaluation, fail-closed rather than skip-as-pass
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p6:D4
  - course-project:p10:gates2-5
  implementation_status: planned
- id: GOV-03
  type: governance
  owner: all
  statement: Every code or prompt PR updates the real AI-use log, a per-PR review memo, and significant bugs and debt; the genuine raw OpenCode sessions of all five members are preserved.
  fit_criterion:
    metric: code_or_prompt_pr_without_log_update
    operator: ==
    threshold: 0
    verification: A git-diff-driven log gate; transcript review must not be fabricated
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p2,6:D4-D5
  - course-project:p10:gate6
  implementation_status: planned
- id: GOV-04
  type: governance
  owner: all
  statement: Safety-path changes require an ADR plus human review; rule changes following a human-reviewed requirements change are synchronized within one sprint.
  fit_criterion:
    metric: unapproved_safety_or_stale_rule_changes
    operator: ==
    threshold: 0
    verification: Safety-path diff check, ADR review, consistency of the rule version/requirements version
  priority: Must
  tradeoff: Keep safety and acceptance; trim unnecessary automation/multi-user/multimodal first, never trade skipped verification for schedule.
  sources:
  - course-project:p6:D3
  - course-project:p10:branch-protection
