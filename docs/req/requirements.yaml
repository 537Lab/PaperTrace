schema_version: 1
project: PaperTrace
baseline: c692d0dfeac4a0296599f7fe21a253a58b7ac12a
status: proposed-awaiting-student-review
requirements:
- id: FR-A-01
  type: functional
  owner: A
  statement: 导入本地PDF/TXT，显示每个文件的成功、失败与原因，逻辑文献ID与内容SHA256版本分离。
  fit_criterion:
    metric: import_case_pass_ratio
    operator: '>='
    threshold: 1.0
    verification: A正负导入测试；本轮仅契约测试，业务未开发
  priority: Must
  tradeoff: 保留安全及验收，先裁剪非必要自动化/多用户/多模态，不以跳过验证换工期。
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: FR-A-02
  type: functional
  owner: A
  statement: 文献变更创建新不可变快照，旧快照与历史记录不得被覆写。
  fit_criterion:
    metric: mutated_historical_snapshots
    operator: ==
    threshold: 0
    verification: 同路径换内容/删除/重复文献/失败导入用例
  priority: Must
  tradeoff: 保留安全及验收，先裁剪非必要自动化/多用户/多模态，不以跳过验证换工期。
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: FR-B-01
  type: functional
  owner: B
  statement: 通过固定PaperQA2异步接口检索候选证据，输出可定位原文、版本及团队派生身份；摘要和相关度仅供参考。
  fit_criterion:
    metric: candidate_records_with_valid_source_ratio
    operator: ==
    threshold: 1.0
    verification: 合成Context适配及真实上游离线集成测试
  priority: Must
  tradeoff: 保留安全及验收，先裁剪非必要自动化/多用户/多模态，不以跳过验证换工期。
  sources:
  - paperqa:src/paperqa/docs.py:156-169,492-500
  - paperqa:src/paperqa/types.py:238-316
  implementation_status: planned
- id: FR-B-02
  type: functional
  owner: B
  statement: 检索失败、超时、空结果及模型解析错误显示明确状态，禁止伪造证据或静默换模型。
  fit_criterion:
    metric: unreported_retrieval_failures
    operator: ==
    threshold: 0
    verification: 异常注入与有界重试/无网络负测
  priority: Must
  tradeoff: 保留安全及验收，先裁剪非必要自动化/多用户/多模态，不以跳过验证换工期。
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: FR-C-01
  type: functional
  owner: C
  statement: 只有真实人工操作能接受/排除/重置证据；追加审核决定并推进审核revision及digest。
  fit_criterion:
    metric: unauthorized_accepted_decisions
    operator: ==
    threshold: 0
    verification: 模型建议不授予权限/伪造actor/撤销与重置测试
  priority: Must
  tradeoff: 保留安全及验收，先裁剪非必要自动化/多用户/多模态，不以跳过验证换工期。
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: FR-C-02
  type: functional
  owner: C
  statement: 比较至少两条证据时展示文献、版本、原文定位、摘要与审核理由；不得自动把相似视为同一证据。
  fit_criterion:
    metric: required_comparison_fields_present_ratio
    operator: ==
    threshold: 1.0
    verification: 两来源相反论点的展示和不修改ledger测试
  priority: Must
  tradeoff: 保留安全及验收，先裁剪非必要自动化/多用户/多模态，不以跳过验证换工期。
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: FR-D-01
  type: functional
  owner: D
  statement: 当没有人工获准证据时返回拒答状态，不进入任何生成调用。
  fit_criterion:
    metric: generation_attempts_with_empty_approved_set
    operator: ==
    threshold: 0
    verification: 模型出站spy断言；真实业务未开发
  priority: Must
  tradeoff: 保留安全及验收，先裁剪非必要自动化/多用户/多模态，不以跳过验证换工期。
  sources:
  - course-project:p3,5
  - audit:GAP-05
  implementation_status: implemented
- id: FR-D-02
  type: functional
  owner: D
  statement: 回答引用必须属于本轮实际发送且仍有效的获准证据；发布前重新核对快照与审核revision/digest，变更即阻断。
  fit_criterion:
    metric: unauthorized_or_stale_releases
    operator: ==
    threshold: 0
    verification: 未发送/已排除/未知引用与生成中语料或审核变化负测
  priority: Must
  tradeoff: 保留安全及验收，先裁剪非必要自动化/多用户/多模态，不以跳过验证换工期。
  sources:
  - course-project:p5-6
  implementation_status: implemented
- id: FR-D-03
  type: functional
  owner: D
  statement: 仅通过受控适配路径生成答案，禁止aquery自动补证以及pre/post和自主Agent绕过；保留引用原始映射。
  fit_criterion:
    metric: uncontrolled_outbound_attempts
    operator: ==
    threshold: 0
    verification: 实际adapter集成出站spy与生成后发布门测试
  priority: Must
  tradeoff: 保留安全及验收，先裁剪非必要自动化/多用户/多模态，不以跳过验证换工期。
  sources:
  - paperqa:src/paperqa/docs.py:588-721
  implementation_status: implemented
- id: FR-E-01
  type: functional
  owner: E
  statement: 导出JSON与Markdown研究报告，包含问题、快照、获准及实际发送证据、审核决定、答案、发布结果和来源定位。
  fit_criterion:
    metric: export_roundtrip_required_fields_ratio
    operator: ==
    threshold: 1.0
    verification: 跨会话加载/导出结构/版本兼容/来源定位用例
  priority: Must
  tradeoff: 保留安全及验收，先裁剪非必要自动化/多用户/多模态，不以跳过验证换工期。
