  implementation_status: planned
- id: FR-E-02
  type: functional
  owner: E
  statement: 历史报告只读；新版本标记旧快照已被替代，默认导出不包含凭据、本机绝对路径或未经授权论文全文。
  fit_criterion:
    metric: sensitive_or_unlicensed_export_fields
    operator: ==
    threshold: 0
    verification: 自写脱敏fixture与历史不变hash测试
  priority: Must
  tradeoff: 保留安全及验收，先裁剪非必要自动化/多用户/多模态，不以跳过验证换工期。
