- id: QA-01
  type: quality
  owner: all
  statement: 共享契约对规范JSON序列化再解析保持相等，未知字段与非法状态必须拒绝。
  fit_criterion:
    metric: contract_roundtrip_and_negative_test_pass_ratio
    operator: ==
    threshold: 1.0
    verification: test/offline/test_contracts.py
  priority: Must
  tradeoff: 保留安全及验收，先裁剪非必要自动化/多用户/多模态，不以跳过验证换工期。
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: PERF-01
  type: performance
  owner: all
  statement: 在记录硬件及版本的离线环境中，100个小型契约JSON往返的总耗时不超过2秒；不推断PaperQA性能提升。
  fit_criterion:
    metric: contract_100_roundtrip_wall_seconds
    operator: <=
    threshold: 2.0
    verification: 独立计时基准，保留实测结果；本轮适用于小型合成样例
  priority: Must
  tradeoff: 保留安全及验收，先裁剪非必要自动化/多用户/多模态，不以跳过验证换工期。
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: COST-01
  type: cost
  owner: all
  statement: PaperTrace产品的初始化验证和默认离线测试不调用产品LLM；编码/审查助手推理另计入AI-use log，不宣称零额度；真实产品评估必须另批provider/model、数据和金额/次数上限。
  fit_criterion:
    metric: initialization_model_requests
    operator: ==
    threshold: 0
    verification: 网络禁用测试；运行前无凭据白名单环境；真实评估授权记录
  priority: Must
  tradeoff: 保留安全及验收，先裁剪非必要自动化/多用户/多模态，不以跳过验证换工期。
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: SEC-01
  type: security
  owner: all
  statement: 仓库与交付包不得含真实凭据或成员个人信息；仅用自写合成数据做团队默认测试。
  fit_criterion:
    metric: detected_secrets_or_member_identity_fields
    operator: ==
    threshold: 0
    verification: 受控路径与内容扫描及人工审查；不扫描用户私有目录
  priority: Must
  tradeoff: 保留安全及验收，先裁剪非必要自动化/多用户/多模态，不以跳过验证换工期。
  sources:
  - course-project:p5-6
  implementation_status: planned
- id: GOV-01
  type: governance
  owner: all
  statement: 测试和执行计划必须由非实现者在实现开始前真实批准；未批准则不能进入正式业务开发/合并。
  fit_criterion:
    metric: unapproved_implementation_merges
    operator: ==
    threshold: 0
    verification: 可信GitHub审核/时序证据；本轮待授权，不能用PR自写approved自证
  priority: Must
  tradeoff: 保留安全及验收，先裁剪非必要自动化/多用户/多模态，不以跳过验证换工期。
  sources:
  - course-project:p10:gate1
  - course-project:p7:D9
  implementation_status: planned
- id: GOV-02
  type: governance
  owner: all
  statement: 每轮执行结构、完整既往回归、行为三级验证；prompt/model变化必须通过真实固定语义评估后才可生产。
  fit_criterion:
    metric: unverified_prompt_or_model_production_merges
    operator: ==
    threshold: 0
    verification: 六类门禁；无真实评估时fail-closed而非skip-as-pass
  priority: Must
  tradeoff: 保留安全及验收，先裁剪非必要自动化/多用户/多模态，不以跳过验证换工期。
  sources:
  - course-project:p6:D4
  - course-project:p10:gates2-5
  implementation_status: planned
- id: GOV-03
  type: governance
  owner: all
  statement: 每次代码或prompt PR更新真实AI使用日志、逐PR审查memo、显著bug与债务；保留五人的真实原始OpenCode会话。
  fit_criterion:
    metric: code_or_prompt_pr_without_log_update
    operator: ==
    threshold: 0
    verification: git差异驱动log gate；transcript审核不得伪造
  priority: Must
  tradeoff: 保留安全及验收，先裁剪非必要自动化/多用户/多模态，不以跳过验证换工期。
  sources:
  - course-project:p2,6:D4-D5
  - course-project:p10:gate6
  implementation_status: planned
- id: GOV-04
  type: governance
  owner: all
  statement: 安全路径变化须ADR+人工审核；规则在人类审核后的需求变更一个sprint内同步。
  fit_criterion:
    metric: unapproved_safety_or_stale_rule_changes
    operator: ==
    threshold: 0
    verification: 安全路径diff检查、ADR审查、规则版本/需求版本一致性
  priority: Must
  tradeoff: 保留安全及验收，先裁剪非必要自动化/多用户/多模态，不以跳过验证换工期。
  sources:
  - course-project:p6:D3
  - course-project:p10:branch-protection
  implementation_status: planned
