  type: invariant
  owner: D
  statement: 零获准证据意味着零生成调用，不把模型自称有证据视为授权。
  fit_criterion:
    metric: generation_attempts_with_empty_approved_set
    operator: ==
    threshold: 0
    verification: 不变量破坏负例必须导致测试失败；具体运行测试见架构追踪矩阵
