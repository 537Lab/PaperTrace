        set -euo pipefail
        BASE="${{ steps.control.outputs.sha }}"
        .venv/bin/python .control/scripts/gates.py --root "$GITHUB_WORKSPACE/target" --gate regression --base "$BASE" --head "$PAPERTRACE_HEAD" --scope full --timeout 1200 --runtime-python "$GITHUB_WORKSPACE/target/.venv-runtime/bin/python" --upstream-python "$GITHUB_WORKSPACE/target/.venv-upstream/bin/python"
