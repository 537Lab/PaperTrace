# Exact fetched prior/base SHA; missing adopted verifier is explicitly BLOCKED.
# Tokens only for metadata; native macOS OpenCode tests actually execute.
name: gates
'on':
  push: {}
  pull_request: {}
  pull_request_review:
    types:
    - submitted
    - dismissed
    - edited
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test-approval:
    name: test-approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAPERTRACE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      PAPERTRACE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PIP_CONFIG_FILE: /dev/null
      PYTHONNOUSERSITE: '1'
      TMPDIR: ${{ github.workspace }}/.local/ci-tmp
      UV_NO_PROGRESS: '1'
      PAPERTRACE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
    - name: Checkout exact candidate target
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
        path: target
    - name: Select exact prior verifier SHA
      id: control
      shell: bash
      run: |
        set -euo pipefail
        BASE="$PAPERTRACE_BASE"
        if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
          BASE="$(git -C target rev-parse "refs/remotes/origin/$PAPERTRACE_DEFAULT_BRANCH")"
        fi
        [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || { printf '%s\n' 'Invalid literal verifier base SHA' >&2; exit 1; }
        printf 'sha=%s\n' "$BASE" >> "$GITHUB_OUTPUT"
    - name: Checkout exact prior verifier and dependency lock
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ steps.control.outputs.sha }}
        fetch-depth: 0
        persist-credentials: false
        path: .control
    - name: Require adopted executable base verifier (never candidate self-certification)
      shell: bash
      run: |
        set -euo pipefail
        if [[ ! -f .control/scripts/gate_evidence.py || ! -f .control/scripts/semantic_evidence.py || ! -f .control/scripts/full_regression.py ]]; then
          printf '%s\n' '{"status":"BLOCKED","reason":"BASE_VERIFIER_UPGRADE_REQUIRED","instruction":"Independent human adoption is required; candidate changes cannot approve themselves"}'
          exit 2
        fi
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.14.6
    - name: Install pinned verifier environment
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$TMPDIR"
        python -m venv .venv
        .venv/bin/python -m pip install --disable-pip-version-check --no-deps -r .control/requirements-init.lock
    - name: Verify real GitHub evidence using trusted base only
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PAPERTRACE_PR_NUMBER: ${{ github.event.pull_request.number }}
        PAPERTRACE_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        BASE="${{ steps.control.outputs.sha }}"
        .venv/bin/python .control/scripts/gates.py --root "$GITHUB_WORKSPACE/target" --gate test-approval --base "$BASE" --head "$PAPERTRACE_HEAD" --scope full
