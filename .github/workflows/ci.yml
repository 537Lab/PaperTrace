    steps:
    - name: Checkout exact candidate target
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
        path: target
    - name: Select exact prior verifier SHA
      id: control
      shell: bash
      run: "set -euo pipefail\nBASE=\"$PAPERTRACE_BASE\"\nCONTROL=\"$BASE\"\nif [[ \"$PAPERTRACE_EVENT\" == \"push\" || \"$PAPERTRACE_EVENT\"\
        \ == \"workflow_dispatch\" ]]; then\n  [[ \"$PAPERTRACE_REF\" == \"refs/heads/main\" ]] || { printf '%s\\n' 'Post-merge checks\
        \ must target main' >&2; exit 1; }\n  if [[ \"$PAPERTRACE_EVENT\" == \"workflow_dispatch\" ]]; then\n    BASE=\"$(git -C target\
        \ rev-parse \"$PAPERTRACE_HEAD^1\")\"\n  fi\n  # Already merged main is the adopted verifier, never an unmerged PR candidate.\n\
        \  # Metadata gates still resolve/revalidate the real merged PR; direct push fails.\n  CONTROL=\"$PAPERTRACE_HEAD\"\nfi\n[[\
        \ \"$BASE\" =~ ^[0-9a-f]{40}$ && \"$BASE\" != \"0000000000000000000000000000000000000000\" ]] || { printf '%s\\n' 'Invalid literal\
        \ comparison base SHA' >&2; exit 1; }\n[[ \"$CONTROL\" =~ ^[0-9a-f]{40}$ ]] || { printf '%s\\n' 'Invalid literal verifier SHA'\
        \ >&2; exit 1; }\nprintf 'sha=%s\\nbase=%s\\n' \"$CONTROL\" \"$BASE\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Checkout exact prior verifier and dependency lock
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ steps.control.outputs.sha }}
        fetch-depth: 0
        persist-credentials: false
        path: .control
    - name: Require adopted executable base verifier (never candidate self-certification)
      shell: bash
      run: "set -euo pipefail\nif [[ ! -f .control/scripts/gate_evidence.py || ! -f .control/scripts/semantic_evidence.py || ! -f .control/scripts/full_regression.py\
        \ || ! -f .control/scripts/ci_events.py ]]; then\n  printf '%s\\n' '{\"status\":\"BLOCKED\",\"reason\":\"BASE_VERIFIER_UPGRADE_REQUIRED\"\
        ,\"instruction\":\"Independent human adoption is required; candidate changes cannot approve themselves\"}'\n  exit 2\nfi\n"
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.14.6
    - name: Install pinned verifier environment
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$TMPDIR"

        python -m venv .venv

        .venv/bin/python -m pip install --disable-pip-version-check --no-deps -r .control/requirements-init.lock

        '
    - name: Execute gate without provider credentials
      shell: bash
      run: 'set -euo pipefail

        BASE="${{ steps.control.outputs.base }}"

        .venv/bin/python .control/scripts/gates.py --root "$GITHUB_WORKSPACE/target" --gate ai-log --base "$BASE" --head "$PAPERTRACE_HEAD"
        --scope full --event-name "$GITHUB_EVENT_NAME" --event-path "$GITHUB_EVENT_PATH"

        '
      env:
        PAPERTRACE_PR_NUMBER: ${{ github.event.pull_request.number }}
